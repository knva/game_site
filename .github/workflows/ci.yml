name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test-stdlib:
    name: pytest (stdlib server.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests (standard library backend)
        run: python -m pytest tests/ -q -k "not fastapi"

  test-fastapi:
    name: pytest (FastAPI app/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run tests (FastAPI backend)
        env:
          CI: "1"
        run: python -m pytest tests/ -q -k "fastapi"
