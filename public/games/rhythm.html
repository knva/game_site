<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐游戏 8键</title>
<link rel="stylesheet" href="/css/style.css">
<style>
/* 舞台:860x520 逻辑坐标,整体缩放 */
.rh-stage {
  position: relative; width: 100%; max-width: 900px; margin: 0 auto;
  aspect-ratio: 860 / 520; border-radius: 14px; overflow: hidden;
  background:
    radial-gradient(circle at 50% 30%, #1c2340, #0b0e1e 70%);
  box-shadow: inset 0 0 60px rgba(0,0,0,.6);
}
.rh-inner { position: absolute; inset: 0; transform-origin: top left; }
/* 音轨 */
.rh-lane {
  position: absolute; top: 0; bottom: 0;
  border-left: 1px solid rgba(255,255,255,.07); border-right: 1px solid rgba(255,255,255,.07);
  transition: box-shadow .12s;
}
.rh-lane.flash { box-shadow: inset 0 0 30px rgba(255,255,255,.35); }
/* 判定线 */
.rh-hitline {
  position: absolute; left: 4%; right: 4%; top: 470px; height: 5px; border-radius: 3px;
  background: rgba(255,255,255,.8); box-shadow: 0 0 14px rgba(255,255,255,.7);
  z-index: 4;
}
/* 音符 */
.rh-note {
  position: absolute; width: 44px; height: 44px; z-index: 3;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 35% 30%, #fff 0 12%, transparent 13%),
    var(--nc);
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  box-shadow: 0 0 14px var(--nc), inset 0 0 12px rgba(255,255,255,.25);
  animation: note-spin .7s linear infinite;
}
@keyframes note-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.rh-note.hit {
  animation: note-hit .3s ease-out forwards;
}
@keyframes note-hit {
  to { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
}
/* 判定光圈 */
.rh-ring {
  position: absolute; top: 470px; width: 60px; height: 60px;
  border: 4px solid #ffd54f; border-radius: 50%; z-index: 5; pointer-events: none;
  transform: translate(-50%, -50%); opacity: 0;
}
.rh-ring.go { animation: ring-pop .3s ease-out forwards; }
@keyframes ring-pop {
  from { opacity: 1; transform: translate(-50%, -50%) scale(.6); }
  to { opacity: 0; transform: translate(-50%, -50%) scale(2.6); }
}
/* 打击火花 */
.rh-spark {
  position: absolute; width: 8px; height: 8px; border-radius: 50%; z-index: 6; pointer-events: none;
  animation: spark-fly .35s ease-out forwards;
}
@keyframes spark-fly {
  to { transform: translate(var(--dx), var(--dy)); opacity: 0; }
}
/* 音符提示条 */
.rh-keyhint {
  position: absolute; left: 4%; right: 4%; top: 482px; display: flex; z-index: 4;
}
.rh-keyhint kbd {
  flex: 1; text-align: center; font-size: 14px; padding: 4px 0;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
  border-radius: 8px; color: var(--muted); margin: 0 2px;
}
</style>
</head>
<body>
<div class="game-wrap">
  <div class="three-box">
    <div class="three-hud">
      <span class="stat">🎵 得分 <b id="hud-score">0</b></span>
      <span class="stat">🔥 连击 <b id="hud-combo">0</b></span>
      <span class="stat">🎯 判定 <b id="hud-judge" style="color:var(--gold)">-</b></span>
      <span class="stat">精准 <b id="hud-acc">100%</b></span>
    </div>
    <div class="rh-stage" id="stage">
      <div class="rh-inner" id="inner">
        <div id="lanes"></div>
        <div class="rh-hitline"></div>
        <div id="notes-layer"></div>
        <div class="rh-ring" id="ring"></div>
        <div class="rh-keyhint"><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd><kbd>;</kbd></div>
        <div id="fx-layer"></div>
      </div>
    </div>
    <div style="position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;z-index:6">
      <button class="btn" id="btn-start" style="font-size:17px;padding:12px 34px">▶ 开始演奏</button>
    </div>
  </div>

  <div class="game-panel">
    <h2>📖 玩法</h2>
    <p style="color:var(--muted);line-height:2">
      音符从顶部向你飞来，到达判定线时按下对应按键。<b style="color:var(--ok)">Perfect +100</b> · <b style="color:var(--gold)">Good +60</b> · 漏掉算 Miss。<br>
      连击越高单次得分越高（最高 2 倍）。谱面由<b style="color:var(--accent2)">服务器随机生成</b>，防篡改防重放，约 80 秒一首。
    </p>
  </div>
  <div class="game-panel">
    <h2>🏆 节奏排行榜</h2>
    <ul class="rank-list" id="rank-list"></ul>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
gameShell("🎹 音乐游戏 · 8键");
initTopBar();

/* ================= DOM 场景(860x520 逻辑坐标) ================= */
const W = 860, H = 520;
const stage = document.getElementById("stage");
const inner = document.getElementById("inner");
const notesLayer = document.getElementById("notes-layer");
const fxLayer = document.getElementById("fx-layer");
const ring = document.getElementById("ring");
const stageEls = {};

function fit() {
  const s = stage.clientWidth / W;
  inner.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fit);
fit();

const LANES = 8;
const COLORS = ["#ff6b6b", "#ffa94d", "#ffd43b", "#69db7c", "#4dabf7", "#9775fa", "#f783ac", "#63e6be"];
const KEYS = ["KeyA", "KeyS", "KeyD", "KeyF", "KeyJ", "KeyK", "KeyL", "Semicolon"];
const MARGIN_X = 30, LANE_W = (W - MARGIN_X * 2) / LANES;
function laneCenter(i) { return MARGIN_X + i * LANE_W + LANE_W / 2; }

/* 音轨 DOM */
(function buildLanes() {
  const box = document.getElementById("lanes");
  for (let i = 0; i < LANES; i++) {
    const d = document.createElement("div");
    d.className = "rh-lane";
    d.style.left = (MARGIN_X + i * LANE_W) + "px";
    d.style.width = LANE_W + "px";
    d.style.background = `linear-gradient(180deg, ${COLORS[i]}22, ${COLORS[i]}0a 60%, ${COLORS[i]}33)`;
    d.dataset.lane = i;
    box.appendChild(d);
  }
  stageEls.lanes = Array.from(box.children);
})();

/* ================= 音频 ================= */
let audioCtx = null;
function beep(freq, dur = 0.08, vol = 0.2, when = 0) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "square";
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + when + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(audioCtx.currentTime + when);
  o.stop(audioCtx.currentTime + when + dur);
}
function scheduleBeat(bpm) {
  const beat = 60 / bpm;
  let t = 0;
  while (t < 82) {
    beep(60, 0.06, 0.35, t - 0.2);
    beep(1400, 0.03, 0.05, t + beat / 2 - 0.2);
    beep(1400, 0.03, 0.05, t + beat / 2 + beat / 4 - 0.2);
    t += beat;
  }
}

/* ================= 游戏状态 ================= */
const BPM = 132;
let chart = [];
let noteEls = new Map();   // note.t -> el
let running = false, over = false, submitted = false;
let songStart = 0, score = 0, combo = 0, maxCombo = 0, perfects = 0, goods = 0, misses = 0, total = 0;
let judgeText = null;
let gameToken = "", maxScore = 0;
const APPROACH = 1.9;
const SPAWN_Y = -46, HIT_Y = 470;

function startGame() {
  if (!requireLogin()) return;
  submitted = false;
  Api.gameStart("rhythm").then(r => {
    chart = r.chart;
    gameToken = r.token;
    maxScore = r.max_score;
    noteEls.forEach(el => el.remove());
    noteEls.clear();
    fxLayer.innerHTML = "";
    score = 0; combo = 0; maxCombo = 0; perfects = 0; goods = 0; misses = 0; total = 0;
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    songStart = audioCtx.currentTime + 0.4;
    scheduleBeat(BPM);
    running = true; over = false;
    document.getElementById("btn-start").disabled = true;
    toast(`🎵 谱面音符 ${chart.length} 个，出发！`, "ok");
    hud();
  }).catch(e => toast(e.message, "err"));
}

/* 打击特效 */
function sparkAt(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 40 + Math.random() * 90;
    const d = document.createElement("div");
    d.className = "rh-spark";
    d.style.background = color;
    d.style.left = x + "px";
    d.style.top = y + "px";
    d.style.setProperty("--dx", Math.cos(a) * sp + "px");
    d.style.setProperty("--dy", Math.sin(a) * sp - 30 + "px");
    fxLayer.appendChild(d);
    setTimeout(() => d.remove(), 400);
  }
}

/* ================= 判定 ================= */
function judge(keyIdx) {
  if (!running || over) return;
  const now = audioCtx.currentTime - songStart;
  const cand = chart.filter(n => !n.hit && n.lane === keyIdx && Math.abs(n.t - now) < 0.3);
  if (!cand.length) return;
  const n = cand.reduce((a, b) => Math.abs(a.t - now) < Math.abs(b.t - now) ? a : b);
  const dt = n.t - now;
  if (Math.abs(dt) < 0.06) hitNote(n, "Perfect", 100, "#43e97b");
  else if (Math.abs(dt) < 0.16) hitNote(n, "Good", 60, "#ffc94d");
  else if (dt > 0.16) return;
  else missNote(n);
}

function hitNote(n, label, base, css) {
  n.hit = true;
  score += Math.round(base * (1 + Math.min(combo, 100) / 100));
  combo++; maxCombo = Math.max(maxCombo, combo);
  total++;
  label === "Perfect" ? perfects++ : goods++;
  const x = laneCenter(n.lane);
  sparkAt(x, HIT_Y, css);
  const el = noteEls.get(n.t);
  if (el) { el.classList.add("hit"); setTimeout(() => el.remove(), 320); }
  const lane = stageEls.lanes[n.lane];
  lane.classList.add("flash");
  setTimeout(() => lane.classList.remove("flash"), 120);
  ring.style.left = x + "px";
  ring.classList.remove("go"); void ring.offsetWidth;
  ring.classList.add("go");
  judgeText = { label, color: css, t: performance.now() };
  beep(440 + n.lane * 60, 0.09, 0.25);
  hud();
}

function missNote(n) {
  n.hit = true;
  combo = 0; misses++; total++;
  judgeText = { label: "Miss", color: "#ff5d6c", t: performance.now() };
  hud();
}

/* ================= 主循环 ================= */
function noteY(n, now) {
  const toHit = n.t - now;
  const p = Math.min(1, Math.max(0, 1 - toHit / APPROACH));
  return SPAWN_Y + (HIT_Y - SPAWN_Y) * p;
}

function animate(t) {
  requestAnimationFrame(animate);
  if (!running || !audioCtx) return;
  const now = audioCtx.currentTime - songStart;
  if (now > 82) { finish(); return; }
  chart.forEach(n => {
    if (!n.hit && n.t < now - 0.2) missNote(n);
    if (n.hit) return;
    const toHit = n.t - now;
    if (toHit < -0.3 || toHit > APPROACH + 1) return;
    let el = noteEls.get(n.t);
    if (!el) {
      el = document.createElement("div");
      el.className = "rh-note";
      el.style.left = laneCenter(n.lane) + "px";
      el.style.setProperty("--nc", COLORS[n.lane]);
      notesLayer.appendChild(el);
      noteEls.set(n.t, el);
    }
    el.style.top = noteY(n, now) + "px";
  });
  if (over) hud();
}

/* ================= 结算 ================= */
function finish() {
  if (submitted) return;
  submitted = true;
  running = false; over = true;
  document.getElementById("btn-start").disabled = false;
  Api.gameEnd("rhythm", gameToken, score, { perfect: perfects, good: goods, miss: misses })
    .then(r => toast(r.is_best ? `🎉 新纪录 ${r.earned} 分！` : `已结算 +${r.earned} 分`, "ok"))
    .catch(e => toast(e.message, "err"))
    .finally(() => { refreshPoints(); refreshRank(); });
  judgeText = { label: "曲终", color: "#ffc94d", t: performance.now() };
}

function hud() {
  document.getElementById("hud-score").textContent = score;
  document.getElementById("hud-combo").textContent = combo;
  document.getElementById("hud-judge").textContent = judgeText ? judgeText.label : "-";
  document.getElementById("hud-acc").textContent = total ? Math.round((perfects + goods * 0.6) / total * 100) + "%" : "100%";
}

/* ================= 输入 ================= */
document.addEventListener("keydown", e => {
  const i = KEYS.indexOf(e.code);
  if (i >= 0) {
    e.preventDefault();
    judge(i);
  }
});

async function refreshRank() {
  try { await renderLeaderboard(document.getElementById("rank-list"), { type: "score", game: "rhythm" }); } catch (e) {}
}

document.getElementById("btn-start").addEventListener("click", startGame);

/* 判定文字浮层 */
setInterval(() => {
  const el = document.querySelector(".judge-float");
  if (el && performance.now() - judgeText.t > 500) el.remove();
  if (judgeText && performance.now() - judgeText.t < 500) {
    if (!el) {
      const d = document.createElement("div");
      d.className = "judge-float";
      document.querySelector(".three-box").appendChild(d);
      d.textContent = judgeText.label;
      d.style.color = judgeText.color;
    }
  }
}, 80);

animate();
refreshRank();
</script>
</body>
</html>
