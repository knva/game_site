<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄金矿工</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.three-box { position: relative; }
.three-hud {
  position: absolute; top: 10px; left: 0; right: 0; z-index: 6;
  display: flex; justify-content: center; gap: 22px;
  background: rgba(0,0,0,.35); padding: 8px 0; backdrop-filter: blur(4px);
}
/* 舞台:860x520 逻辑坐标,整体缩放 */
.gm-stage {
  position: relative; width: 100%; max-width: 900px; margin: 0 auto;
  aspect-ratio: 860 / 520; border-radius: 14px; overflow: hidden; cursor: pointer;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.05), transparent 35%),
    linear-gradient(180deg, #2a1f4d 0%, #4a3566 96px, #5d3a1e 110px, #4a2e15 55%, #38220e 100%);
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
.gm-inner { position: absolute; inset: 0; transform-origin: top left; }
/* 天空星星 */
.gm-star {
  position: absolute; width: 3px; height: 3px; border-radius: 50%;
  background: #fff; animation: twinkle 1.6s ease-in-out infinite;
}
@keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
/* 平台 */
.gm-platform {
  position: absolute; left: 0; right: 0; top: 86px; height: 24px;
  background: linear-gradient(180deg, #7a5230, #4a3018);
}
.gm-platform::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 3px;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 16px, transparent 16px 34px);
}
/* 右侧梯子 */
.gm-ladder {
  position: absolute; right: 26px; top: 8px; width: 22px; height: 82px;
  border-left: 4px solid #8a6a3a; border-right: 4px solid #8a6a3a;
  background: repeating-linear-gradient(180deg, #6a4e28 0 3px, transparent 3px 14px);
}
/* 土层颗粒 */
.gm-soil-dots {
  position: absolute; left: 0; right: 0; top: 110px; bottom: 0;
  background-image: radial-gradient(circle, rgba(0,0,0,.16) 2px, transparent 2.5px);
  background-size: 48px 42px;
}
/* ============ 矿工(纯 CSS) ============ */
.gm-miner { position: absolute; width: 44px; height: 64px; transform: translate(-50%, -100%); z-index: 5; }
.gm-miner .bob { position: absolute; inset: 0; animation: miner-bob 1s ease-in-out infinite; }
@keyframes miner-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
.gm-miner .m-leg { position: absolute; top: 44px; width: 6px; height: 18px; background: #2c3550; border-radius: 3px; }
.gm-miner .m-leg.l { left: 10px; }
.gm-miner .m-leg.r { right: 10px; }
.gm-miner .m-body {
  position: absolute; left: 9px; top: 18px; width: 26px; height: 30px; border-radius: 7px;
  background: linear-gradient(180deg, #3a6fd8, #2c55a8);
}
.gm-miner .m-belt { position: absolute; left: 9px; top: 36px; width: 26px; height: 5px; background: #8a6a2a; }
.gm-miner .m-belt::after {
  content: ""; position: absolute; left: 10px; top: 0; width: 6px; height: 5px; background: #ffd54f;
}
.gm-miner .m-head {
  position: absolute; left: 13px; top: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f6d4ac, #f0c8a0);
}
.gm-miner .m-head::before {
  content: ""; position: absolute; left: 2px; top: 9px; width: 14px; height: 6px;
  border-radius: 0 0 50% 50%; background: #8a5a2a;
}
.gm-miner .m-eye { position: absolute; top: 8px; width: 3px; height: 3px; border-radius: 50%; background: #222; }
.gm-miner .m-eye.l { left: 16px; }
.gm-miner .m-eye.r { right: 16px; }
.gm-miner .m-hat { position: absolute; left: 8px; top: -2px; width: 28px; height: 8px; border-radius: 4px; background: #e8b93a; }
.gm-miner .m-hat::before {
  content: ""; position: absolute; left: 8px; top: -10px;
  border-left: 6px solid transparent; border-right: 6px solid transparent;
  border-bottom: 10px solid #e8b93a;
}
/* ============ 物品 ============ */
.gm-item { position: absolute; transform: translate(-50%, -50%); z-index: 3; animation: item-pulse 1.2s ease-in-out infinite; }
@keyframes item-pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.06); } }
.gm-item .i { position: absolute; inset: 0; }
.gm-item.gold .i {
  background: radial-gradient(circle at 35% 30%, #ffe98a, #ffc107 60%, #b8860b);
  clip-path: polygon(25% 4%, 75% 4%, 98% 50%, 75% 96%, 25% 96%, 2% 50%);
}
.gm-item.gold::after {
  content: ""; position: absolute; left: 28%; top: 22%; width: 26%; height: 15%;
  border-radius: 50%; background: rgba(255,255,255,.5); transform: rotate(-25deg);
}
.gm-item.diamond .i {
  background: linear-gradient(180deg, #e0f7ff, #81d4fa 50%, #3a7fb5);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  filter: drop-shadow(0 0 8px rgba(129,212,250,.9));
}
.gm-item.diamond::after {
  content: ""; position: absolute; left: 50%; top: 14%; width: 6%; height: 44%;
  transform: translateX(-50%); background: rgba(255,255,255,.85);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
}
.gm-item.bag .i {
  background: radial-gradient(circle at 35% 30%, #ff9c6b, #d84315);
  border-radius: 50% 50% 48% 52% / 55% 55% 45% 45%;
  border: 3px solid #8a2a0a; box-sizing: border-box;
}
.gm-item.bag::before {
  content: "$"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-weight: 900; color: #fff; font-size: 60%; text-shadow: 0 2px 0 #8a2a0a;
}
.gm-item.bag::after {
  content: ""; position: absolute; left: 10%; right: 10%; top: 12%; height: 3px;
  background: #8a2a0a; border-radius: 2px;
}
.gm-item.rock .i {
  background: radial-gradient(circle at 35% 28%, #aeb6c2, #5d6673);
  clip-path: polygon(50% 2%, 82% 14%, 97% 46%, 84% 90%, 46% 98%, 12% 86%, 2% 46%, 18% 14%);
}
.gm-item.rock::after {
  content: ""; position: absolute; left: 30%; top: 42%; width: 40%; height: 3px;
  background: rgba(0,0,0,.25); transform: rotate(-18deg); border-radius: 2px;
}
/* ============ 绳索 + 爪 ============ */
.gm-rope {
  position: absolute; height: 3px; z-index: 4; transform-origin: 0 50%;
  background: repeating-linear-gradient(90deg, #dfe6ff 0 6px, rgba(223,230,255,.35) 6px 10px);
  border-radius: 2px;
}
.gm-claw { position: absolute; width: 26px; height: 28px; transform: translate(-50%, -50%); z-index: 4; }
.gm-claw svg { display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.7)); }
.gm-claw.open svg { filter: drop-shadow(0 0 6px rgba(255,213,79,.8)) drop-shadow(0 2px 2px rgba(0,0,0,.7)); }
/* ============ 特效 ============ */
.pt { position: absolute; width: 5px; height: 5px; border-radius: 50%; z-index: 7; pointer-events: none; }
.pop {
  position: absolute; z-index: 8; font-weight: 900; font-size: 24px; pointer-events: none;
  transform: translate(-50%, -50%); text-shadow: 0 2px 4px rgba(0,0,0,.7);
  animation: pop-float .8s ease-out forwards;
}
@keyframes pop-float {
  from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  to { opacity: 0; transform: translate(-50%, -120%) scale(1.2); }
}
.gm-stage.shake .gm-inner { transition: transform .05s linear; }
</style>
</head>
<body>
<div class="game-wrap">
  <div class="three-box">
    <div class="three-hud">
      <span class="stat">⏱ 时间 <b id="hud-time">60</b></span>
      <span class="stat">💰 本局 <b id="hud-score">0</b></span>
      <span class="stat">拉力 <b id="hud-tension">-</b></span>
    </div>
    <div class="gm-stage" id="stage">
      <div class="gm-inner" id="inner">
        <div id="stars-layer"></div>
        <div class="gm-platform"></div>
        <div class="gm-ladder"></div>
        <div class="gm-soil-dots"></div>
        <div id="items-layer"></div>
        <div class="gm-rope" id="rope" style="display:none"></div>
        <div class="gm-claw" id="claw" style="display:none">
          <svg viewBox="0 0 24 26" width="26" height="28">
            <circle cx="12" cy="3.6" r="2.6" fill="none" stroke="#ffd54f" stroke-width="2.4"/>
            <line x1="12" y1="6" x2="12" y2="19" stroke="#ffd54f" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M3.5 12.5c2.3 3.4 14.7 3.4 17 0" fill="none" stroke="#ffd54f" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M12 15.8l-4 4M12 15.8l4 4" stroke="#ffd54f" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="gm-miner" id="miner">
          <div class="bob">
            <div class="m-leg l"></div>
            <div class="m-leg r"></div>
            <div class="m-body"></div>
            <div class="m-belt"></div>
            <div class="m-head"></div>
            <div class="m-eye l"></div>
            <div class="m-eye r"></div>
            <div class="m-hat"></div>
          </div>
        </div>
        <div id="fx-layer"></div>
      </div>
    </div>
    <div style="position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;z-index:6">
      <button class="btn" id="btn-start" style="font-size:17px;padding:12px 34px">▶ 开始挖矿</button>
    </div>
  </div>

  <div class="game-panel">
    <h2>📖 玩法</h2>
    <p style="color:var(--muted);line-height:2">
      <b>← →</b> 移动矿工 &nbsp; <b>空格 / 点击画面</b> 放下钩子<br>
      抓取 🟡金块 💎钻石 💰钱袋 得分；大石头又慢又沉，长时间拉不上来绳子会断！<br>
      矿脉布局每局固定不变，记住位置，直奔大奖！<br>
      60 秒倒计时结束自动结算。得分由服务器校验，防篡改防重放。
    </p>
  </div>
  <div class="game-panel">
    <h2>🏆 挖矿排行榜</h2>
    <ul class="rank-list" id="rank-list"></ul>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
gameShell("⛏️ 黄金矿工");
initTopBar();

/* ================= DOM 场景(860x520 逻辑坐标,整体缩放) ================= */
const W = 860, H = 520;
const stage = document.getElementById("stage");
const inner = document.getElementById("inner");
const itemsLayer = document.getElementById("items-layer");
const fxLayer = document.getElementById("fx-layer");
const ropeEl = document.getElementById("rope");
const clawEl = document.getElementById("claw");
const minerEl = document.getElementById("miner");

/* 舞台缩放 */
function fit() {
  const s = stage.clientWidth / W;
  inner.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fit);
fit();

/* 星星背景 */
(function buildStars() {
  const box = document.getElementById("stars-layer");
  for (let i = 0; i < 24; i++) {
    const d = document.createElement("div");
    d.className = "gm-star";
    d.style.left = (i * 97.3) % W + "px";
    d.style.top = (i * 41.7) % 78 + "px";
    d.style.animationDelay = (i % 7) * 0.2 + "s";
    box.appendChild(d);
  }
})();

/* 平台（矿工站立处） */
const PLAT_Y = 96;
const CART_MIN = 60, CART_MAX = W - 60;

/* 物品生成表:w=基础权重,big=大奖系数(时间越少放大越多) */
const GEN = [
  { type: "gold", r: 17, w: 2.2, v: 45, big: 0 },
  { type: "gold", r: 25, w: 1.6, v: 90, big: 0 },
  { type: "gold", r: 32, w: 0.7, v: 160, big: 1 },
  { type: "diamond", r: 19, w: 0.5, v: 380, big: 1 },
  { type: "diamond", r: 12, w: 0.9, v: 200, big: 0.7 },
  { type: "bag", r: 22, w: 0.8, v: 130, big: 0.7 },
  { type: "rock", r: 27, w: 1.2, v: 3, big: 0 },
  { type: "rock", r: 38, w: 0.8, v: 3, big: 0 },
];

/* 固定种子随机(矿位布局每局一致) */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const FIXED_SEED = 20260808;
let goldminerSeed = FIXED_SEED;   // 开局时由服务器下发(防作弊,地图按服务端种子生成)
let caught = [];                  // 本局抓取轨迹(结算时提交服务器校验)

/* 按剩余时间计算大奖概率:0.05(开局) → 0.95(最后) */
function bigChance() {
  return 0.05 + (1 - timeLeft / 60) * 0.9;
}

/* 加权随机选矿:bigChance 越高,钻石/大金块/钱袋权重越大 */
function pickGen(rnd, chance) {
  const total = GEN.reduce((s, g) => s + g.w * (g.big ? 1 + chance * 4 : 1), 0);
  let t = rnd() * total;
  for (const g of GEN) {
    t -= g.w * (g.big ? 1 + chance * 4 : 1);
    if (t <= 0) return g;
  }
  return GEN[0];
}

let items = [];
let particles = [];
let popups = [];

/* 矿位+类型完全固定(固定种子,每局布局一致,不随时间刷新) */
function genWorld() {
  items.forEach(it => it.el && it.el.remove());
  items = [];
  const rnd = mulberry32(goldminerSeed);
  const Y0 = 210, Y1 = H - 40;
  let guard = 0;
  while (items.length < 26 && guard++ < 700) {
    const x = 50 + rnd() * (W - 100);
    const y = Y0 + rnd() * (Y1 - Y0);
    const g = pickGen(rnd, 0.5);   // 固定权重,类型也确定
    const r = g.r;
    if (items.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 6)) { guard++; continue; }
    const el = document.createElement("div");
    el.className = "gm-item " + g.type;
    el.style.width = r * 2 + "px";
    el.style.height = r * 2 + "px";
    el.style.animationDelay = -(Math.random() * 1.2) + "s";
    el.innerHTML = '<div class="i"></div>';
    itemsLayer.appendChild(el);
    items.push({ ...g, x, y, vx: 0, vy: 0, grabbed: false, spin: rnd() * 6.28, el });
  }
}

/* 物品/矿工/绳索位置同步 */
function syncItem(it) {
  it.el.style.left = it.x + "px";
  it.el.style.top = it.y + "px";
}

function syncHook(cartX, hook) {
  const startX = cartX, startY = PLAT_Y - 6;
  let tipX, tipY;
  if (hook.item) { tipX = hook.item.x; tipY = hook.item.y; }
  else {
    tipX = startX + Math.sin(hook.angle) * hook.len;
    tipY = startY + hook.len * Math.cos(hook.angle);
  }
  ropeEl.style.display = "block";
  ropeEl.style.left = startX + "px";
  ropeEl.style.top = startY + "px";
  ropeEl.style.width = hook.len + "px";
  ropeEl.style.transform = `rotate(${90 - hook.angle * 180 / Math.PI}deg)`;
  clawEl.style.display = "block";
  clawEl.style.left = tipX + "px";
  clawEl.style.top = tipY + "px";
  clawEl.classList.toggle("open", !hook.item);
}

function syncMiner(cartX) {
  minerEl.style.left = cartX + "px";
  minerEl.style.top = PLAT_Y - 4 + "px";
}

/* 粒子 / 浮动文字 */
function burst(x, y, color, n = 26) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 160;
    const p = document.createElement("div");
    p.className = "pt";
    p.style.background = color;
    fxLayer.appendChild(p);
    particles.push({ el: p, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 1 });
  }
}
function popup(text, x, y, color = "#ffd54f") {
  const p = document.createElement("div");
  p.className = "pop";
  p.textContent = text;
  p.style.color = color;
  p.style.left = x + "px";
  p.style.top = y + "px";
  fxLayer.appendChild(p);
  popups.push({ el: p, t: performance.now() });
}

/* ================= 游戏逻辑 ================= */
const keys = {};
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); dropHook(); }
  keys[e.code] = true;
});
document.addEventListener("keyup", e => keys[e.code] = false);
stage.addEventListener("click", () => { if (running) dropHook(); });

let running = false, over = false, submitted = false;
let timeLeft = 60, score = 0;
let cartX = W / 2;
let hook = null, tension = 0;
let gameToken = "";

function dropHook() {
  if (!running || over || !hook || hook.drop) return;
  hook.drop = true;
}

function startGame() {
  if (!requireLogin()) return;
  submitted = false;
  Api.gameStart("goldminer").then(r => {
    gameToken = r.token;
    goldminerSeed = r.goldminer_seed || FIXED_SEED;   // 服务器种子生成地图
    caught = [];
    reset();
    genWorld();
    running = true;
    toast(`门票 -${r.ticket}💎 · 结算收益 ${r.pay_range[0]}~${r.pay_range[1]}💎`, "ok");
  }).catch(e => toast(e.message, "err"));
}

/* 矿脉刷新:每 12 秒重生成,剩余时间越少大奖概率越高 */
let refreshTimer = null;
function startRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if (!running || over) return;
    if (hook && hook.item) loseItem();
    genWorld(bigChance());
    popup("⛏ 矿脉刷新!", W / 2, PLAT_Y + 46, "#ffe14d");
    if (bigChance() > 0.45) popup("💎 大奖概率 UP!", W / 2, PLAT_Y + 80, "#ff9c6b");
  }, 12000);
}
function stopRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = null;
}

function reset() {
  over = false;
  timeLeft = 60; score = 0; cartX = W / 2;
  tension = 0;
  hook = { angle: 0, speed: 1.05, drop: false, len: 40, maxLen: H - 60, item: null };
  ropeEl.style.display = "none";
  clawEl.style.display = "none";
  fxLayer.innerHTML = "";
  particles = []; popups = [];
  syncMiner(cartX);
  hud();
}

function loseItem() {
  if (hook.item) {
    hook.item.grabbed = false;
    hook.item.vy = -180; hook.item.vx = (Math.random() - 0.5) * 200;
    hook.item.flying = true;   // 甩飞的矿做自由落体,落地停住
  }
  hook.item = null;
  hook.drop = false;
  hook.len = 40;   // 拉空/断绳后绳长复位,钩子缩回摇摆位置,可继续游玩
  tension = 0;
}

/* ================= 主循环 ================= */
let last = 0;
let shake = 0;
let stageScale = 1;

function applyShake() {
  if (shake > 0) {
    const sx = (Math.random() - 0.5) * shake * 14;
    const sy = (Math.random() - 0.5) * shake * 14;
    inner.style.transform = `scale(${stageScale}) translate(${sx}px, ${sy}px)`;
  } else {
    inner.style.transform = `scale(${stageScale})`;
  }
}

function animate(t) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (t - last) / 1000 || 0.016);
  last = t;

  if (running && !over) {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; over = true; finish(); }
    hud();
    if (keys.ArrowLeft) cartX = Math.max(CART_MIN, cartX - 260 * dt);
    if (keys.ArrowRight) cartX = Math.min(CART_MAX, cartX + 260 * dt);

    const h = hook;
    if (!h.drop) {
      h.angle += h.speed * dt;
      if (h.angle > 0.8 || h.angle < -0.8) h.speed *= -1;   // ±46° 大幅摆动
    } else if (!h.item) {
      h.len += 260 * dt;
      if (h.len >= h.maxLen) loseItem();
      const tipX = cartX + Math.sin(h.angle) * h.len;
      const tipY = PLAT_Y - 6 + h.len * Math.cos(h.angle);
      const hit = items.find(i => !i.grabbed && Math.hypot(i.x - tipX, i.y - tipY) < i.r + 10);
      if (hit) {
        h.item = hit;
        hit.grabbed = true;
        tension = 0;
        burst(hit.x, hit.y, "#ffd54f", 14);
      }
    } else {
      const it = h.item;
      tension += dt * (0.9 + it.w * 0.5);
      if (tension >= 100) {
        loseItem();
        shake = 0.6;
        toast("绳子断了！", "err");
      } else if (h.len <= 8) {
        score += it.v;
        caught.push({ v: it.v });
        burst(it.x, it.y, it.type === "diamond" ? "#81d4fa" : "#ffd54f", 30);
        popup(`+${it.v}`, it.x, it.y - 20);
        it.grabbed = false;
        it.el.remove();
        items.splice(items.indexOf(it), 1);
        h.item = null;
        h.drop = false;
        h.len = 40;   // 收获后绳长复位,钩子回到摇摆位置(否则缩没看不见)
      }
      h.len -= (2.2 / it.w) * dt * 100;
      const a = h.angle;
      it.x = cartX + Math.sin(a) * h.len;
      it.y = PLAT_Y - 6 + h.len * Math.cos(a);
      if (it.w >= 6) shake = Math.max(shake, 0.12);
    }
  }

  /* 物品物理:位置始终同步,仅被甩飞的矿做自由落体 */
  items.forEach(it => {
    if (!it.flying) { syncItem(it); return; }   // 固定矿:只同步位置
    if (it.grabbed) return;
    it.vy += 220 * dt;
    it.y += it.vy * dt;
    it.x += it.vx * dt;
    it.vx *= 0.98;
    if (it.y > H - it.r) { it.y = H - it.r; it.vy = -it.vy * 0.4; it.vx *= 0.7; }
    if (it.x < it.r) it.x = it.r;
    if (it.x > W - it.r) it.x = W - it.r;
    /* 落地停住,不再弹跳 */
    if (it.y >= H - it.r - 0.5 && Math.abs(it.vy) < 5) { it.vy = 0; it.vx = 0; it.flying = false; }
    syncItem(it);
  });
  if (hook.item && !hook.item.grabbed) { hook.item = null; hook.drop = false; tension = 0; }

  /* 粒子更新 */
  particles.forEach(p => {
    p.life -= dt * 1.2;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 260 * dt;
    p.el.style.left = p.x + "px";
    p.el.style.top = p.y + "px";
    p.el.style.opacity = Math.max(0, p.life);
  });
  particles = particles.filter(p => p.life > 0);
  popups.forEach(p => { if (performance.now() - p.t > 800) { p.el.remove(); } });
  popups = popups.filter(p => performance.now() - p.t <= 800);

  /* 渲染 */
  if (shake > 0) shake -= dt;
  stageScale = stage.clientWidth / W;
  applyShake();
  syncMiner(cartX);
  syncHook(cartX, hook);

  if (over) hud();
}

/* ================= 结算 ================= */
function finish() {
  if (submitted) return;
  submitted = true;
  stopRefresh();
  Api.gameEnd("goldminer", gameToken, Math.round(score), { catches: caught })
    .then(r => {
      toast(r.is_best ? `🎉 新纪录 ${r.earned} 分！收益 +${r.earned}💎` : `结算完成：收益 +${r.earned}💎`);
      refreshPoints();
    })
    .catch(e => toast(e.message, "err"))
    .finally(refreshRank);
  hud();
}

function hud() {
  document.getElementById("hud-time").textContent = Math.max(0, Math.ceil(timeLeft));
  document.getElementById("hud-score").textContent = score;
  document.getElementById("hud-tension").textContent = hook && hook.item ? Math.round(tension) + "%" : "-";
}

async function refreshRank() {
  try { await renderLeaderboard(document.getElementById("rank-list"), { type: "score", game: "goldminer" }); } catch (e) {}
}

document.getElementById("btn-start").addEventListener("click", startGame);

genWorld(0);
reset();
requestAnimationFrame(animate);
refreshRank();
</script>
</body>
