<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄金矿工</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.three-box { position: relative; }
.three-hud {
  position: absolute; top: 10px; left: 0; right: 0; z-index: 6;
  display: flex; justify-content: center; gap: 22px;
  background: rgba(0,0,0,.35); padding: 8px 0; backdrop-filter: blur(4px);
}
#stage { display: block; width: 100%; border-radius: 14px; cursor: pointer; }
</style>
</head>
<body>
<div class="game-wrap">
  <div class="three-box">
    <div class="three-hud">
      <span class="stat">⏱ 时间 <b id="hud-time">60</b></span>
      <span class="stat">💰 本局 <b id="hud-score">0</b></span>
      <span class="stat">拉力 <b id="hud-tension">-</b></span>
    </div>
    <canvas id="stage" width="860" height="520"></canvas>
    <div style="position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;z-index:6">
      <button class="btn" id="btn-start" style="font-size:17px;padding:12px 34px">▶ 开始挖矿</button>
    </div>
  </div>

  <div class="game-panel">
    <h2>📖 玩法</h2>
    <p style="color:var(--muted);line-height:2">
      <b>← →</b> 移动矿工 &nbsp; <b>空格 / 点击画面</b> 放下钩子<br>
      抓取 🟡金块 💎钻石 💰钱袋 得分；大石头又慢又沉，长时间拉不上来绳子会断！<br>
      每 12 秒矿脉刷新一次——⏳ 时间越少，💎 大奖（钻石/大金块）概率越高！<br>
      60 秒倒计时结束自动结算。得分由服务器校验，防篡改防重放。
    </p>
  </div>
  <div class="game-panel">
    <h2>🏆 挖矿排行榜</h2>
    <ul class="rank-list" id="rank-list"></ul>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
gameShell("⛏️ 黄金矿工");
initTopBar();

/* ================= Canvas 2D 场景 ================= */
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;

/* 平台（矿工站立处） */
const PLAT_Y = 96;
const CART_MIN = 60, CART_MAX = W - 60;

/* 物品生成表:w=基础权重,big=大奖系数(时间越少放大越多) */
const GEN = [
  { type: "gold", r: 17, w: 2.2, v: 45, big: 0 },
  { type: "gold", r: 25, w: 1.6, v: 90, big: 0 },
  { type: "gold", r: 32, w: 0.7, v: 160, big: 1 },
  { type: "diamond", r: 19, w: 0.5, v: 380, big: 1 },
  { type: "diamond", r: 12, w: 0.9, v: 200, big: 0.7 },
  { type: "bag", r: 22, w: 0.8, v: 130, big: 0.7 },
  { type: "rock", r: 27, w: 1.2, v: 3, big: 0 },
  { type: "rock", r: 38, w: 0.8, v: 3, big: 0 },
];

/* 固定种子随机(矿位布局每局一致) */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const FIXED_SEED = 20260808;

/* 按剩余时间计算大奖概率:0.05(开局) → 0.95(最后) */
function bigChance() {
  return 0.05 + (1 - timeLeft / 60) * 0.9;
}

/* 加权随机选矿:bigChance 越高,钻石/大金块/钱袋权重越大 */
function pickGen(rnd, chance) {
  const total = GEN.reduce((s, g) => s + g.w * (g.big ? 1 + chance * 4 : 1), 0);
  let t = rnd() * total;
  for (const g of GEN) {
    t -= g.w * (g.big ? 1 + chance * 4 : 1);
    if (t <= 0) return g;
  }
  return GEN[0];
}

let items = [];
let particles = [];
let popups = [];

/* 矿位固定(固定种子),类型按大奖概率加权 */
function genWorld(chance = 0) {
  items = [];
  const rnd = mulberry32(FIXED_SEED);
  const Y0 = 210, Y1 = H - 40;
  let guard = 0;
  while (items.length < 26 && guard++ < 700) {
    const x = 50 + rnd() * (W - 100);
    const y = Y0 + rnd() * (Y1 - Y0);
    const g = pickGen(rnd, chance);
    const r = g.r;
    if (items.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 6)) { guard++; continue; }
    items.push({ ...g, x, y, vx: 0, vy: 0, grabbed: false, spin: rnd() * 6.28 });
  }
}

/* ================= 绘制 ================= */
function drawBackground() {
  /* 天空 */
  const sky = ctx.createLinearGradient(0, 0, 0, PLAT_Y);
  sky.addColorStop(0, "#2a1f4d"); sky.addColorStop(1, "#4a3566");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, PLAT_Y);
  /* 星星 */
  ctx.fillStyle = "rgba(255,255,255,.7)";
  for (let i = 0; i < 24; i++) {
    const sx = (i * 97.3) % W, sy = (i * 41.7) % (PLAT_Y - 30);
    ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(performance.now() / 900 + i));
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;
  /* 平台 */
  const plat = ctx.createLinearGradient(0, PLAT_Y - 14, 0, PLAT_Y + 16);
  plat.addColorStop(0, "#7a5230"); plat.addColorStop(1, "#4a3018");
  ctx.fillStyle = plat;
  ctx.fillRect(0, PLAT_Y - 10, W, 22);
  ctx.fillStyle = "rgba(0,0,0,.25)";
  for (let x = 0; x < W; x += 34) ctx.fillRect(x, PLAT_Y + 2, 18, 3);
  /* 土层 */
  const soil = ctx.createLinearGradient(0, PLAT_Y, 0, H);
  soil.addColorStop(0, "#5d3a1e"); soil.addColorStop(.5, "#4a2e15"); soil.addColorStop(1, "#38220e");
  ctx.fillStyle = soil;
  ctx.fillRect(0, PLAT_Y + 12, W, H - PLAT_Y);
  /* 土粒 */
  ctx.fillStyle = "rgba(0,0,0,.18)";
  for (let i = 0; i < 120; i++) {
    const x = (i * 61.7) % W, y = PLAT_Y + 14 + ((i * 37.3) % (H - PLAT_Y - 20));
    ctx.fillRect(x, y, 2 + (i % 3), 2);
  }
  /* 右侧小梯子装饰 */
  ctx.strokeStyle = "#8a6a3a"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(W - 40, PLAT_Y - 8); ctx.lineTo(W - 40, 10); ctx.stroke();
  ctx.strokeStyle = "#6a4e28";
  for (let y = 14; y < PLAT_Y - 10; y += 14) {
    ctx.beginPath(); ctx.moveTo(W - 52, y); ctx.lineTo(W - 28, y); ctx.stroke();
  }
}

function drawMiner(x) {
  const t = performance.now() / 1000;
  const bob = Math.sin(t * 2.2) * 1.2;
  ctx.save();
  ctx.translate(x, PLAT_Y - 4 + bob);
  /* 腿 */
  ctx.strokeStyle = "#2c3550"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(-10, 24); ctx.moveTo(8, 8); ctx.lineTo(10, 24); ctx.stroke();
  /* 身体 */
  ctx.fillStyle = "#3a6fd8";
  roundRect(-13, -18, 26, 28, 6); ctx.fill();
  ctx.fillStyle = "#2c55a8";
  roundRect(-13, -4, 26, 14, 6); ctx.fill();
  /* 腰带 */
  ctx.fillStyle = "#8a6a2a"; ctx.fillRect(-13, -2, 26, 5);
  ctx.fillStyle = "#ffd54f"; ctx.fillRect(-3, -2, 6, 5);
  /* 头 */
  ctx.fillStyle = "#f0c8a0";
  ctx.beginPath(); ctx.arc(0, -30, 9, 0, Math.PI * 2); ctx.fill();
  /* 胡子 */
  ctx.fillStyle = "#8a5a2a";
  ctx.beginPath(); ctx.arc(0, -24, 8, 0.25, Math.PI - 0.25); ctx.fill();
  /* 帽子 */
  ctx.fillStyle = "#e8b93a";
  ctx.beginPath(); ctx.ellipse(0, -38, 14, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-10, -38); ctx.lineTo(0, -52); ctx.lineTo(12, -38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c9952a";
  ctx.fillRect(-10, -38, 20, 3);
  /* 眼睛 */
  ctx.fillStyle = "#222";
  ctx.beginPath(); ctx.arc(-3, -31, 1.8, 0, Math.PI * 2); ctx.arc(3, -31, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawItem(it) {
  ctx.save();
  ctx.translate(it.x, it.y);
  const pulse = 1 + Math.sin(performance.now() / 400 + it.spin) * 0.04;
  ctx.scale(pulse, pulse);
  if (it.type === "gold") {
    const g = ctx.createRadialGradient(-4, -5, 3, 0, 0, it.r);
    g.addColorStop(0, "#ffe98a"); g.addColorStop(.6, "#ffc107"); g.addColorStop(1, "#b8860b");
    ctx.fillStyle = g;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2 + 0.3;
      const rr = i % 2 ? it.r : it.r * 0.82;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#8a6200"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.beginPath(); ctx.ellipse(-it.r * .3, -it.r * .35, it.r * .3, it.r * .16, -.5, 0, Math.PI * 2); ctx.fill();
  } else if (it.type === "diamond") {
    ctx.shadowColor = "#81d4fa"; ctx.shadowBlur = 14;
    const g = ctx.createLinearGradient(0, -it.r, 0, it.r);
    g.addColorStop(0, "#e0f7ff"); g.addColorStop(.5, "#81d4fa"); g.addColorStop(1, "#3a7fb5");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -it.r); ctx.lineTo(it.r * .7, 0); ctx.lineTo(0, it.r); ctx.lineTo(-it.r * .7, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.shadowBlur = 0;
  } else if (it.type === "bag") {
    const g = ctx.createRadialGradient(-4, -5, 3, 0, 0, it.r);
    g.addColorStop(0, "#ff9c6b"); g.addColorStop(1, "#d84315");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 2, it.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#8a2a0a"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = `bold ${it.r}px sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("$", 0, it.r * 0.1);
    ctx.strokeStyle = "#8a2a0a"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-it.r * .5, -it.r * .6); ctx.lineTo(it.r * .5, -it.r * .6); ctx.stroke();
  } else { /* rock */
    const g = ctx.createRadialGradient(-5, -6, 4, 0, 0, it.r);
    g.addColorStop(0, "#aeb6c2"); g.addColorStop(1, "#5d6673");
    ctx.fillStyle = g;
    ctx.beginPath();
    const n = 7;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      const rr = it.r * (0.85 + ((i * 37) % 13) / 40);
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#454d58"; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-it.r * .4, -it.r * .1); ctx.lineTo(-it.r * .05, it.r * .25); ctx.lineTo(it.r * .35, it.r * .1);
    ctx.stroke();
  }
  ctx.restore();
}

function drawHook(cartX, hook) {
  const startX = cartX, startY = PLAT_Y - 6;
  let tipX, tipY;
  if (hook.item) { tipX = hook.item.x; tipY = hook.item.y; }
  else {
    tipX = startX + Math.sin(hook.angle) * hook.len;
    tipY = startY + hook.len * Math.cos(hook.angle);
  }
  /* 绳索 */
  ctx.strokeStyle = "#dfe6ff"; ctx.lineWidth = 2.5;
  ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(tipX, tipY); ctx.stroke();
  ctx.setLineDash([]);
  /* 爪 */
  ctx.save();
  ctx.translate(tipX, tipY);
  const open = hook.item ? 0.45 : 0.95;
  ctx.rotate(Math.sin(hook.angle) * 0.35);
  ctx.strokeStyle = "#e8ecff"; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(6 * open, 14);
  ctx.moveTo(0, 0); ctx.lineTo(-6 * open, 14);
  ctx.stroke();
  ctx.fillStyle = "#ffd54f";
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#8a6a00"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

/* 粒子 */
function burst(x, y, color, n = 26) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 1, color });
  }
}
function popup(text, x, y, color = "#ffd54f") {
  popups.push({ text, x, y, life: 1, color });
}

/* ================= 游戏逻辑 ================= */
const keys = {};
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); dropHook(); }
  keys[e.code] = true;
});
document.addEventListener("keyup", e => keys[e.code] = false);
cv.addEventListener("click", () => { if (running) dropHook(); });

let running = false, over = false, submitted = false;
let timeLeft = 60, score = 0;
let cartX = W / 2;
let hook = null, tension = 0;
let gameToken = "";

function dropHook() {
  if (!running || over || !hook || hook.drop) return;
  hook.drop = true;
}

function startGame() {
  if (!requireLogin()) return;
  submitted = false;
  Api.gameStart("goldminer").then(r => {
    gameToken = r.token;
    reset();
    genWorld(bigChance());
    running = true;
    startRefresh();
    toast(`门票 -${r.ticket}💎 · 结算收益 ${r.pay_range[0]}~${r.pay_range[1]}💎`, "ok");
  }).catch(e => toast(e.message, "err"));
}

/* 矿脉刷新:每 12 秒重生成,剩余时间越少大奖概率越高 */
let refreshTimer = null;
function startRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if (!running || over) return;
    if (hook && hook.item) loseItem();
    genWorld(bigChance());
    popup("⛏ 矿脉刷新!", W / 2, PLAT_Y + 46, "#ffe14d");
    if (bigChance() > 0.45) popup("💎 大奖概率 UP!", W / 2, PLAT_Y + 80, "#ff9c6b");
  }, 12000);
}
function stopRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = null;
}

function reset() {
  over = false;
  timeLeft = 60; score = 0; cartX = W / 2;
  tension = 0;
  hook = { angle: 0, speed: 0.85, drop: false, len: 2, maxLen: H - 60, item: null };
  hud();
}

function loseItem() {
  if (hook.item) {
    hook.item.grabbed = false;
    hook.item.vy = -180; hook.item.vx = (Math.random() - 0.5) * 200;
  }
  hook.item = null;
  hook.drop = false;
  tension = 0;
}

/* ================= 主循环 ================= */
let last = 0;
let shake = 0;

function animate(t) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (t - last) / 1000 || 0.016);
  last = t;

  if (running && !over) {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; over = true; finish(); }
    hud();
    if (keys.ArrowLeft) cartX = Math.max(CART_MIN, cartX - 260 * dt);
    if (keys.ArrowRight) cartX = Math.min(CART_MAX, cartX + 260 * dt);

    const h = hook;
    if (!h.drop) {
      h.angle += h.speed * dt;
      if (h.angle > 0.55 || h.angle < -0.55) h.speed *= -1;
    } else if (!h.item) {
      h.len += 260 * dt;
      if (h.len >= h.maxLen) loseItem();
      const tipX = cartX + Math.sin(h.angle) * h.len;
      const tipY = PLAT_Y - 6 + h.len * Math.cos(h.angle);
      const hit = items.find(i => !i.grabbed && Math.hypot(i.x - tipX, i.y - tipY) < i.r + 10);
      if (hit) {
        h.item = hit;
        hit.grabbed = true;
        tension = 0;
        burst(hit.x, hit.y, "#ffd54f", 14);
      }
    } else {
      const it = h.item;
      tension += dt * (0.9 + it.w * 0.5);
      if (tension >= 100) {
        loseItem();
        shake = 0.6;
        toast("绳子断了！", "err");
      } else if (h.len <= 8) {
        score += it.v;
        burst(it.x, it.y, it.type === "diamond" ? "#81d4fa" : "#ffd54f", 30);
        popup(`+${it.v}`, it.x, it.y - 20);
        it.grabbed = false;
        items.splice(items.indexOf(it), 1);
        h.item = null;
        h.drop = false;
      }
      h.len -= (2.2 / it.w) * dt * 100;
      const a = h.angle;
      it.x = cartX + Math.sin(a) * h.len;
      it.y = PLAT_Y - 6 + h.len * Math.cos(a);
      if (it.w >= 6) shake = Math.max(shake, 0.12);
    }
  }

  /* 物品自由落体 */
  items.forEach(it => {
    if (it.grabbed) return;
    it.vy += 220 * dt;
    it.y += it.vy * dt;
    it.x += it.vx * dt;
    it.vx *= 0.98;
    if (it.y > H - it.r) { it.y = H - it.r; it.vy = -it.vy * 0.4; it.vx *= 0.7; }
    if (it.x < it.r) it.x = it.r;
    if (it.x > W - it.r) it.x = W - it.r;
  });
  if (hook.item && !hook.item.grabbed) { hook.item = null; hook.drop = false; tension = 0; }

  /* 粒子更新 */
  particles.forEach(p => {
    p.life -= dt * 1.2;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 260 * dt;
  });
  particles = particles.filter(p => p.life > 0);
  popups.forEach(p => { p.life -= dt; p.y -= 40 * dt; });
  popups = popups.filter(p => p.life > 0);

  /* ===== 渲染 ===== */
  ctx.save();
  if (shake > 0) {
    shake -= dt;
    ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);
  }
  drawBackground();
  items.forEach(drawItem);
  drawHook(cartX, hook);
  drawMiner(cartX);
  /* 粒子 */
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  });
  ctx.globalAlpha = 1;
  /* 浮动文字 */
  popups.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.lineWidth = 4;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillText(p.text, p.x, p.y);
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  if (over) hud();
}

/* ================= 结算 ================= */
function finish() {
  if (submitted) return;
  submitted = true;
  stopRefresh();
  Api.gameEnd("goldminer", gameToken, Math.round(score), {})
    .then(r => {
      toast(r.is_best ? `🎉 新纪录 ${r.earned} 分！收益 +${r.earned}💎` : `结算完成：收益 +${r.earned}💎`);
      refreshPoints();
    })
    .catch(e => toast(e.message, "err"))
    .finally(refreshRank);
  hud();
}

function hud() {
  document.getElementById("hud-time").textContent = Math.max(0, Math.ceil(timeLeft));
  document.getElementById("hud-score").textContent = score;
  document.getElementById("hud-tension").textContent = hook && hook.item ? Math.round(tension) + "%" : "-";
}

async function refreshRank() {
  try { await renderLeaderboard(document.getElementById("rank-list"), { type: "score", game: "goldminer" }); } catch (e) {}
}

document.getElementById("btn-start").addEventListener("click", startGame);

genWorld(0);
reset();
requestAnimationFrame(animate);
refreshRank();
</script>
</body>
</html>
