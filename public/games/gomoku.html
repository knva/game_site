<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.gomoku-box { position: relative; }
.board-frame {
  position: relative; width: 100%; max-width: 600px; margin: 0 auto;
  background: radial-gradient(ellipse at 30% 20%, #d9a75c, #8a5a2b 70%);
  border-radius: 14px; padding: 12px;
  box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.4);
  cursor: pointer; user-select: none;
}
.board {
  display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr);
  aspect-ratio: 1; position: relative;
}
.cell { position: relative; }
/* 网格线 */
.cell::before { content: ""; position: absolute; left: 0; right: 0; bottom: -0.5px; height: 1px; background: #4a2f14; }
.cell::after { content: ""; position: absolute; top: 0; bottom: 0; right: -0.5px; width: 1px; background: #4a2f14; }
/* 星位 */
.cell .star {
  position: absolute; left: 50%; top: 50%; width: 13%; height: 13%;
  transform: translate(-50%, -50%); border-radius: 50%; background: #4a2f14;
}
/* 悬停高亮 */
.cell.hover { box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); border-radius: 4px; }
/* 棋子 */
.cell .stone {
  position: absolute; left: 8%; top: 8%; width: 84%; height: 84%; border-radius: 50%;
  z-index: 2; animation: stone-drop .3s cubic-bezier(.2, 1.6, .4, 1);
  box-shadow: 0 3px 6px rgba(0,0,0,.55);
}
.cell .stone.black {
  background: radial-gradient(circle at 35% 30%, #5a5f68, #23262c 60%, #0c0d10);
}
.cell .stone.white {
  background: radial-gradient(circle at 35% 30%, #ffffff, #e8e8e8 70%, #b9b9b9);
}
@keyframes stone-drop {
  from { transform: translateY(-350%) scale(.6); opacity: 0; }
  70% { transform: translateY(3%) scale(1.05); opacity: 1; }
  to { transform: none; opacity: 1; }
}
/* 最后落子标记 */
.cell .last-mark {
  position: absolute; inset: 6%; border: 2px solid rgba(255,60,60,.9); border-radius: 50%; z-index: 3;
}
/* 胜利高亮 */
.cell .stone.win {
  outline: 3px solid rgba(255,213,79,.95); outline-offset: -2px;
  animation: win-pulse 1s ease-in-out infinite;
}
@keyframes win-pulse {
  0%, 100% { box-shadow: 0 0 6px rgba(255,213,79,.5); }
  50% { box-shadow: 0 0 18px rgba(255,213,79,1); }
}
#gomoku-status {
  position: absolute; top: 12px; left: 12px; z-index: 5; font-size: 13px;
  background: rgba(0,0,0,.55); padding: 5px 10px; border-radius: 8px;
  backdrop-filter: blur(4px);
}
</style>
</head>
<body>
<div class="game-wrap">
  <div class="gomoku-layout">
    <div class="gomoku-box" id="stage-wrap">
      <div class="board-frame">
        <div class="board" id="board"></div>
      </div>
      <div id="gomoku-status"></div>
    </div>

    <div class="gomoku-side">
      <div class="panel gomoku-menu" id="menu">
        <h2>⚫ 开始对局</h2>
        <button class="btn" id="btn-bot">🤖 人机对战</button>
        <button class="btn gray" id="btn-create">👥 创建房间（约好友）</button>
        <div style="display:flex;gap:8px">
          <input id="join-code" placeholder="输入房间码" style="flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;outline:none">
          <button class="btn gray" id="btn-join">加入</button>
        </div>
      </div>

      <div class="panel" id="room-panel" style="display:none">
        <h2>🏠 房间 <span id="room-mode" class="tag"></span></h2>
        <div class="code-big" id="room-code">-</div>
        <p style="color:var(--muted);font-size:12px;margin-top:8px">把房间码发给好友，或在站内信里直接邀请</p>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn mini gray" id="btn-copy">📋 复制房间码</button>
          <button class="btn mini gray" id="btn-invite">📬 站内信邀请</button>
        </div>
      </div>

      <div class="panel" id="game-panel" style="display:none">
        <h2>📊 对局信息</h2>
        <div id="game-info" style="font-size:14px;line-height:2;color:var(--muted)"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn mini gray" id="btn-leave">🏳 认输/离开</button>
        </div>
      </div>

      <div class="panel">
        <h2>🏆 棋力排行榜</h2>
        <ul class="rank-list" id="rank-list"></ul>
      </div>
    </div>
  </div>
</div>

<!-- 邀请弹窗 -->
<div class="modal-mask" id="invite-modal">
  <div class="modal">
    <h2>📬 站内信邀请</h2>
    <input id="inv-to" placeholder="对方昵称">
    <textarea id="inv-msg" style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px;font-size:14px;min-height:80px;outline:none" placeholder="附言（可选）"></textarea>
    <button class="btn" id="inv-send" style="width:100%">发送邀请</button>
    <button class="modal-close" onclick="document.getElementById('invite-modal').style.display='none'">✕</button>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
gameShell("⚫ 五子棋");
initTopBar();

/* ================= 纯 DOM 棋盘(15x15) ================= */
const SIZE = 15;
const STARS = [[3,3],[7,3],[11,3],[3,7],[7,7],[11,7],[3,11],[7,11],[11,11]];
const boardEl = document.getElementById("board");
const cells = [];
(function buildBoard() {
  for (let j = 0; j < SIZE; j++) {
    for (let i = 0; i < SIZE; i++) {
      const c = document.createElement("div");
      c.className = "cell";
      c.dataset.i = i; c.dataset.j = j;
      if (STARS.some(([si, sj]) => si === i && sj === j)) {
        const s = document.createElement("i");
        s.className = "star";
        c.appendChild(s);
      }
      boardEl.appendChild(c);
      cells.push(c);
    }
  }
})();

const stoneEls = new Map();   // "i,j" -> 棋子 div

function setStone(i, j, color, opts = {}) {
  const key = `${i},${j}`;
  const c = cells[j * SIZE + i];
  const old = stoneEls.get(key);
  if (old) old.remove();
  const s = document.createElement("div");
  s.className = "stone " + (color === 1 ? "black" : "white");
  if (opts.win) s.classList.add("win");
  c.appendChild(s);
  stoneEls.set(key, s);
}

function clearScene() {
  cells.forEach(c => {
    const kids = c.querySelectorAll(".stone, .last-mark");
    kids.forEach(k => k.remove());
  });
  stoneEls.clear();
}

/* 胜利连线（高亮五连子） */
function highlightWin(board, color) {
  const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
  for (let j = 0; j < SIZE; j++) for (let i = 0; i < SIZE; i++) {
    if (board[j * SIZE + i] !== color) continue;
    for (const [dx, dy] of dirs) {
      let cnt = 1;
      const pts = [[i, j]];
      for (let k = 1; ; k++) {
        const ni = i + dx * k, nj = j + dy * k;
        if (ni < 0 || nj < 0 || ni >= SIZE || nj >= SIZE || board[nj * SIZE + ni] !== color) break;
        cnt++; pts.push([ni, nj]);
      }
      if (cnt >= 5) return pts;
    }
  }
  return [];
}

/* 交互 */
boardEl.addEventListener("mousemove", e => {
  const c = e.target.closest(".cell");
  if (!c) return;
  const i = +c.dataset.i, j = +c.dataset.j;
  const occupied = state && state.board[j * SIZE + i] !== 0;
  const can = state && state.can_move && !occupied;
  cells.forEach(x => x.classList.remove("hover"));
  if (can) c.classList.add("hover");
});
boardEl.addEventListener("mouseleave", () => cells.forEach(x => x.classList.remove("hover")));
boardEl.addEventListener("click", async (e) => {
  const c = e.target.closest(".cell");
  if (!c || !state || !state.can_move) return;
  const i = +c.dataset.i, j = +c.dataset.j;
  if (state.board[j * SIZE + i] !== 0) return;
  try { await Api.gomokuMove(state.code, i, j); }
  catch (err) { toast(err.message, "err"); }
});

/* ================= 房间与状态 ================= */
let state = null;
let es = null;
let pollTimer = null;
const MY = () => Store.user ? Store.user.username : "";

function applyState(s) {
  state = s;
  clearScene();
  let lastIdx = -1;
  s.board.forEach((v, idx) => {
    if (v) {
      lastIdx = idx;
      const i = idx % SIZE, j = Math.floor(idx / SIZE);
      setStone(i, j, v);
    }
  });
  /* 最后落子标记 */
  if (lastIdx >= 0) {
    const i = lastIdx % SIZE, j = Math.floor(lastIdx / SIZE);
    const m = document.createElement("div");
    m.className = "last-mark";
    cells[j * SIZE + i].appendChild(m);
  }
  /* 胜利高亮 */
  if (s.winner !== null && s.winner !== undefined) {
    let winColor = 0;
    if (s.winner === s.black_id) winColor = 1;
    else if (s.winner === s.white_id) winColor = 2;
    else if (s.winner === 0) winColor = 2;
    highlightWin(s.board, winColor).forEach(([i, j]) => {
      const key = `${i},${j}`;
      if (stoneEls.has(key)) stoneEls.get(key).classList.add("win");
    });
  }
  /* 状态信息 */
  const info = document.getElementById("game-info");
  const colorName = s.my_color === "black" ? "⚫ 黑棋" : s.my_color === "white" ? "⚪ 白棋" : "-";
  if (s.status === "waiting") {
    info.innerHTML = `状态：<b style="color:var(--gold)">等待对手加入…</b><br>你是 ${colorName}，先手`;
  } else if (s.status === "playing") {
    const turn = s.turn === 1 ? "⚫ 黑棋" : "⚪ 白棋";
    info.innerHTML = `你是 ${colorName}<br>轮到：<b style="color:${s.turn === 1 ? "#fff" : "#ffc94d"}">${turn}</b>${s.mode === "bot" ? "（AI）" : ""}<br>${s.can_move ? "👉 点击棋盘落子" : ""}`;
  } else {
    let res = "对局结束";
    if (s.reason) res = `${s.reason} · `;
    res += s.winner === null ? "平局" : (s.winner === s.black_online ? "⚫ 黑方胜" : s.winner === s.white_online ? "⚪ 白方胜" : "AI 获胜");
    info.innerHTML = `状态：<b style="color:var(--gold)">${res}</b><br>积分已结算`;
    toast(`对局结束：${res}`, "ok");
    refreshPoints();
    refreshRank();
  }
  document.getElementById("gomoku-status").textContent =
    s.status === "playing" ? (s.can_move ? "🟢 轮到你" : "⏳ 等待对方…") : s.status === "waiting" ? "🟡 等待玩家" : "🏁 已结束";
}

function connectRoom(code) {
  if (es) es.close();
  clearInterval(pollTimer);
  es = new EventSource(`/api/gomoku/stream?code=${code}&token=${Store.token}`);
  es.onmessage = (ev) => {
    if (!ev.data || ev.data === "refresh" || ev.data === "null") return;
    try { applyState(JSON.parse(ev.data)); } catch (e) {}
  };
  es.onerror = () => { /* 自动重连，失败则轮询兜底 */ };
  pollTimer = setInterval(async () => {
    if (es && es.readyState === EventSource.CLOSED) {
      try { applyState(await Api.gomokuRoom(code)); } catch (e) {}
    }
  }, 2500);
}

async function enterRoom(code, mode) {
  if (!requireLogin()) return;
  try {
    const s = await Api.gomokuRoom(code);
    document.getElementById("menu").style.display = "none";
    document.getElementById("room-panel").style.display = "";
    document.getElementById("game-panel").style.display = "";
    document.getElementById("room-code").textContent = code;
    document.getElementById("room-mode").textContent = mode === "bot" ? "🤖 人机" : "👥 双人";
    connectRoom(code);
    applyState(s);
  } catch (e) { toast(e.message, "err"); }
}

document.getElementById("btn-bot").onclick = async () => {
  if (!requireLogin()) return;
  try {
    const r = await Api.gomokuCreate("bot");
    enterRoom(r.code, "bot");
  } catch (e) { toast(e.message, "err"); }
};
document.getElementById("btn-create").onclick = async () => {
  if (!requireLogin()) return;
  try {
    const r = await Api.gomokuCreate("pvp");
    enterRoom(r.code, "pvp");
    toast(`房间已创建：${r.code}，快邀请好友！`, "ok");
  } catch (e) { toast(e.message, "err"); }
};
document.getElementById("btn-join").onclick = async () => {
  if (!requireLogin()) return;
  const code = document.getElementById("join-code").value.trim().toUpperCase();
  if (!code) { toast("请输入房间码", "err"); return; }
  try {
    await Api.gomokuJoin(code);
    enterRoom(code, "pvp");
  } catch (e) { toast(e.message, "err"); }
};
document.getElementById("btn-copy").onclick = async () => {
  const code = document.getElementById("room-code").textContent;
  try {
    await navigator.clipboard.writeText(code);
    toast("房间码已复制", "ok");
  } catch (e) {
    prompt("复制房间码", code);
  }
};
document.getElementById("btn-invite").onclick = () => {
  document.getElementById("invite-modal").style.display = "flex";
};
document.getElementById("inv-send").onclick = async () => {
  const to = document.getElementById("inv-to").value.trim();
  const code = document.getElementById("room-code").textContent;
  const extra = document.getElementById("inv-msg").value.trim();
  if (!to) { toast("请填写对方昵称", "err"); return; }
  try {
    await Api.mailSend(to, "五子棋邀请", `来一局五子棋！房间码：${code}${extra ? "\n" + extra : ""}`);
    document.getElementById("invite-modal").style.display = "none";
    toast("邀请已发送", "ok");
  } catch (e) { toast(e.message, "err"); }
};
document.getElementById("btn-leave").onclick = async () => {
  if (!state) return;
  try {
    await Api.gomokuLeave(state.code);
    location.reload();
  } catch (e) { toast(e.message, "err"); }
};

async function refreshRank() {
  try {
    const { list } = await Api.gomokuRank();
    const box = document.getElementById("rank-list");
    box.innerHTML = list.length
      ? list.map((r, i) => `<li class="rank-row ${i < 3 ? "top" : ""}"><span class="rank">${i + 1}</span><span class="rank-name">${escapeHtml(r.username)}</span><span class="rank-val">${r.wins} 胜</span></li>`).join("")
      : `<li class="rank-row empty">暂无对局记录</li>`;
  } catch (e) {}
}

refreshRank();
</script>
</body>
</html>
