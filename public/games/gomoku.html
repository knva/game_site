<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.gomoku-box { position: relative; }
.gomoku-box canvas {
  display: block; width: 100%; border-radius: 14px;
  background: radial-gradient(ellipse at 30% 20%, #8a5a2b, #5d3a18 70%);
  box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.4);
  cursor: pointer;
}
#gomoku-status {
  position: absolute; top: 12px; left: 12px; z-index: 5; font-size: 13px;
  background: rgba(0,0,0,.55); padding: 5px 10px; border-radius: 8px;
  backdrop-filter: blur(4px);
}
</style>
</head>
<body>
<div class="game-wrap">
  <div class="gomoku-layout">
    <div class="gomoku-box" id="stage-wrap">
      <canvas id="stage"></canvas>
      <div id="gomoku-status"></div>
    </div>

    <div class="gomoku-side">
      <div class="panel gomoku-menu" id="menu">
        <h2>⚫ 开始对局</h2>
        <button class="btn" id="btn-bot">🤖 人机对战</button>
        <button class="btn gray" id="btn-create">👥 创建房间（约好友）</button>
        <div style="display:flex;gap:8px">
          <input id="join-code" placeholder="输入房间码" style="flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;outline:none">
          <button class="btn gray" id="btn-join">加入</button>
        </div>
      </div>

      <div class="panel" id="room-panel" style="display:none">
        <h2>🏠 房间 <span id="room-mode" class="tag"></span></h2>
        <div class="code-big" id="room-code">-</div>
        <p style="color:var(--muted);font-size:12px;margin-top:8px">把房间码发给好友，或在站内信里直接邀请</p>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn mini gray" id="btn-copy">📋 复制房间码</button>
          <button class="btn mini gray" id="btn-invite">📬 站内信邀请</button>
        </div>
      </div>

      <div class="panel" id="game-panel" style="display:none">
        <h2>📊 对局信息</h2>
        <div id="game-info" style="font-size:14px;line-height:2;color:var(--muted)"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn mini gray" id="btn-leave">🏳 认输/离开</button>
        </div>
      </div>

      <div class="panel">
        <h2>🏆 棋力排行榜</h2>
        <ul class="rank-list" id="rank-list"></ul>
      </div>
    </div>
  </div>
</div>

<!-- 邀请弹窗 -->
<div class="modal-mask" id="invite-modal">
  <div class="modal">
    <h2>📬 站内信邀请</h2>
    <input id="inv-to" placeholder="对方昵称">
    <textarea id="inv-msg" style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px;font-size:14px;min-height:80px;outline:none" placeholder="附言（可选）"></textarea>
    <button class="btn" id="inv-send" style="width:100%">发送邀请</button>
    <button class="modal-close" onclick="document.getElementById('invite-modal').style.display='none'">✕</button>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
gameShell("⚫ 五子棋");
initTopBar();

/* ================= HTML5 Canvas 2D 棋盘 ================= */
const SIZE = 15;
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
let cw = 0, ch = 0, cell = 24, ox = 0, oy = 0;

function resize() {
  const w = document.getElementById("stage-wrap").clientWidth;
  const h = Math.max(320, w * 0.8);
  const dpr = window.devicePixelRatio || 1;
  cw = w; ch = h;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cell = Math.min(w, h) / (SIZE + 1.5);
  const boardW = cell * (SIZE - 1);
  ox = (w - boardW) / 2;
  oy = (h - boardW) / 2;
}
window.addEventListener("resize", resize);
resize();

/* 棋子与动画 */
const stones = new Map();     // "x,y" -> {i, j, color, last}
const drops = [];             // 落子动画 {i, j, color, t}
let winCells = [];            // 胜利高亮格子
let winPulse = 0;
let hoverCell = null;
let lastMove = null;          // 最后落子 {i, j}

function cellPos(i, j) { return { x: ox + i * cell, y: oy + j * cell }; }

function addStone(i, j, color) {
  const key = `${i},${j}`;
  if (!stones.has(key)) stones.set(key, { i, j, color, last: false });
  stones.get(key).color = color;
  drops.push({ i, j, color, t: 0 });
  lastMove = { i, j };
}
function clearScene() {
  stones.clear();
  drops.length = 0;
  winCells = [];
  lastMove = null;
}

/* 画一个棋子 */
function drawStone(x, y, r, color, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = "rgba(0,0,0,.55)";
  ctx.shadowBlur = r * 0.5;
  ctx.shadowOffsetY = r * 0.22;
  if (color === 1) {
    const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
    g.addColorStop(0, "#5a5f68"); g.addColorStop(.6, "#23262c"); g.addColorStop(1, "#0c0d10");
    ctx.fillStyle = g;
  } else {
    const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
    g.addColorStop(0, "#ffffff"); g.addColorStop(.7, "#e8e8e8"); g.addColorStop(1, "#b9b9b9");
    ctx.fillStyle = g;
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  /* 高光 */
  ctx.save();
  ctx.globalAlpha = alpha * 0.9;
  ctx.fillStyle = color === 1 ? "rgba(255,255,255,.14)" : "rgba(255,255,255,.8)";
  ctx.beginPath(); ctx.arc(x - r * .32, y - r * .38, r * .22, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw() {
  /* 背景 */
  ctx.clearRect(0, 0, cw, ch);
  const bg = ctx.createLinearGradient(0, 0, 0, ch);
  bg.addColorStop(0, "#a06a33"); bg.addColorStop(1, "#7a4a20");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, cw, ch);
  /* 木纹 */
  ctx.save();
  ctx.globalAlpha = .08;
  for (let i = 0; i < 26; i++) {
    const yy = Math.random() * ch, ww = 40 + Math.random() * 140;
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 1 + Math.random() * 3;
    ctx.beginPath();
    ctx.moveTo(0, yy);
    ctx.quadraticCurveTo(ww, yy + (Math.random() - .5) * 20, cw, yy + (Math.random() - .5) * 30);
    ctx.stroke();
  }
  ctx.restore();

  /* 棋盘板面 */
  const bw = cell * (SIZE - 1);
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.5)";
  ctx.shadowBlur = 18;
  ctx.fillStyle = "#d9a75c";
  roundRect(ctx, ox - cell * .7, oy - cell * .7, bw + cell * 1.4, bw + cell * 1.4, 10);
  ctx.fill();
  ctx.restore();

  /* 网格线 */
  ctx.strokeStyle = "#4a2f14";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < SIZE; i++) {
    const p = cellPos(i, 0), q = cellPos(i, SIZE - 1);
    ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
    const r = cellPos(0, i), s = cellPos(SIZE - 1, i);
    ctx.moveTo(r.x, r.y); ctx.lineTo(s.x, s.y);
  }
  ctx.stroke();

  /* 星位 */
  ctx.fillStyle = "#4a2f14";
  [[3,3],[7,3],[11,3],[3,7],[7,7],[11,7],[3,11],[7,11],[11,11]].forEach(([i, j]) => {
    const p = cellPos(i, j);
    ctx.beginPath(); ctx.arc(p.x, p.y, cell * .11, 0, Math.PI * 2); ctx.fill();
  });

  /* 落子动画（从上方掉落） */
  drops.forEach(d => {
    d.t += 0.05;
    const k = Math.min(1, d.t);
    const e = 1 - Math.pow(1 - k, 3);
    const p = cellPos(d.i, d.j);
    const dropY = p.y - cell * 9 * (1 - e);
    drawStone(p.x, dropY, cell * .43, d.color, Math.min(1, k * 2.2));
  });
  drops.forEach(d => { if (d.t >= 1) drops.splice(drops.indexOf(d), 1); });

  /* 已落棋子 */
  stones.forEach((s, key) => {
    if (drops.some(d => d.i === s.i && d.j === s.j)) return;
    const p = cellPos(s.i, s.j);
    drawStone(p.x, p.y, cell * .43, s.color);
  });

  /* 最后落子标记 */
  if (lastMove && !winCells.length) {
    const p = cellPos(lastMove.i, lastMove.j);
    ctx.strokeStyle = "rgba(255,60,60,.9)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, cell * .5, 0, Math.PI * 2); ctx.stroke();
  }

  /* 悬停预览 */
  if (hoverCell && state && state.can_move &&
      state.board && state.board[hoverCell.j * SIZE + hoverCell.i] === 0) {
    const p = cellPos(hoverCell.i, hoverCell.j);
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.beginPath(); ctx.arc(p.x, p.y, cell * .42, 0, Math.PI * 2); ctx.fill();
  }

  /* 胜利高亮 */
  if (winCells.length) {
    winPulse += 0.06;
    const a = 0.55 + Math.sin(winPulse) * 0.35;
    winCells.forEach(({ i, j }) => {
      const p = cellPos(i, j);
      ctx.save();
      ctx.strokeStyle = `rgba(255,213,79,${a})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = "rgba(255,213,79,.9)";
      ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(p.x, p.y, cell * .5, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* 交互 */
function cellFromEvent(e) {
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const i = Math.round((mx - ox) / cell), j = Math.round((my - oy) / cell);
  if (i < 0 || j < 0 || i >= SIZE || j >= SIZE) return null;
  return { i, j };
}
cv.addEventListener("mousemove", e => { hoverCell = cellFromEvent(e); });
cv.addEventListener("mouseleave", () => { hoverCell = null; });
cv.addEventListener("click", async (e) => {
  const c = cellFromEvent(e);
  if (!c || !state || !state.can_move) return;
  if (state.board[c.j * SIZE + c.i] !== 0) return;
  try { await Api.gomokuMove(state.code, c.i, c.j); }
  catch (err) { toast(err.message, "err"); }
});

/* 胜利连线（高亮五连子） */
function highlightWin(board, color) {
  const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
  for (let j = 0; j < SIZE; j++) for (let i = 0; i < SIZE; i++) {
    if (board[j * SIZE + i] !== color) continue;
    for (const [dx, dy] of dirs) {
      let cnt = 1;
      const pts = [{ i, j }];
      for (let k = 1; ; k++) {
        const ni = i + dx * k, nj = j + dy * k;
        if (ni < 0 || nj < 0 || ni >= SIZE || nj >= SIZE || board[nj * SIZE + ni] !== color) break;
        cnt++; pts.push({ i: ni, j: nj });
      }
      if (cnt >= 5) {
        winCells = pts;
        return;
      }
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  draw();
}

/* ================= 房间与状态 ================= */
let state = null;
let es = null;
let pollTimer = null;
const MY = () => Store.user ? Store.user.username : "";

function applyState(s) {
  state = s;
  clearScene();
  s.board.forEach((v, idx) => {
    if (v) {
      const i = idx % SIZE, j = Math.floor(idx / SIZE);
      addStone(i, j, v);
    }
  });
  if (s.winner !== null && s.winner !== undefined) {
    let winColor = 0;
    if (s.winner === s.black_id) winColor = 1;
    else if (s.winner === s.white_id) winColor = 2;
    else if (s.winner === 0) winColor = 2;
    highlightWin(s.board, winColor);
  }
  /* 状态信息 */
  const info = document.getElementById("game-info");
  const colorName = s.my_color === "black" ? "⚫ 黑棋" : s.my_color === "white" ? "⚪ 白棋" : "-";
  if (s.status === "waiting") {
    info.innerHTML = `状态：<b style="color:var(--gold)">等待对手加入…</b><br>你是 ${colorName}，先手`;
  } else if (s.status === "playing") {
    const turn = s.turn === 1 ? "⚫ 黑棋" : "⚪ 白棋";
    info.innerHTML = `你是 ${colorName}<br>轮到：<b style="color:${s.turn === 1 ? "#fff" : "#ffc94d"}">${turn}</b>${s.mode === "bot" ? "（AI）" : ""}<br>${s.can_move ? "👉 点击棋盘落子" : ""}`;
  } else {
    let res = "对局结束";
    if (s.reason) res = `${s.reason} · `;
    res += s.winner === null ? "平局" : (s.winner === s.black_online ? "⚫ 黑方胜" : s.winner === s.white_online ? "⚪ 白方胜" : "AI 获胜");
    info.innerHTML = `状态：<b style="color:var(--gold)">${res}</b><br>积分已结算`;
    toast(`对局结束：${res}`, "ok");
    refreshPoints();
    refreshRank();
  }
  document.getElementById("gomoku-status").textContent =
    s.status === "playing" ? (s.can_move ? "🟢 轮到你" : "⏳ 等待对方…") : s.status === "waiting" ? "🟡 等待玩家" : "🏁 已结束";
}

function connectRoom(code) {
  if (es) es.close();
  clearInterval(pollTimer);
  es = new EventSource(`/api/gomoku/stream?code=${code}&token=${Store.token}`);
  es.onmessage = (ev) => {
    if (!ev.data || ev.data === "refresh" || ev.data === "null") return;
    try { applyState(JSON.parse(ev.data)); } catch (e) {}
  };
  es.onerror = () => { /* 自动重连，失败则轮询兜底 */ };
  pollTimer = setInterval(async () => {
    if (es && es.readyState === EventSource.CLOSED) {
      try { applyState(await Api.gomokuRoom(code)); } catch (e) {}
    }
  }, 2500);
}

async function enterRoom(code, mode) {
  if (!requireLogin()) return;
  try {
    const s = await Api.gomokuRoom(code);
    document.getElementById("menu").style.display = "none";
    document.getElementById("room-panel").style.display = "";
    document.getElementById("game-panel").style.display = "";
    document.getElementById("room-code").textContent = code;
    document.getElementById("room-mode").textContent = mode === "bot" ? "🤖 人机" : "👥 双人";
    connectRoom(code);
    applyState(s);
  } catch (e) { toast(e.message, "err"); }
}

document.getElementById("btn-bot").onclick = async () => {
  if (!requireLogin()) return;
  try {
    const r = await Api.gomokuCreate("bot");
    enterRoom(r.code, "bot");
  } catch (e) { toast(e.message, "err"); }
};
document.getElementById("btn-create").onclick = async () => {
  if (!requireLogin()) return;
  try {
    const r = await Api.gomokuCreate("pvp");
    enterRoom(r.code, "pvp");
    toast(`房间已创建：${r.code}，快邀请好友！`, "ok");
  } catch (e) { toast(e.message, "err"); }
};
document.getElementById("btn-join").onclick = async () => {
  if (!requireLogin()) return;
  const code = document.getElementById("join-code").value.trim().toUpperCase();
  if (!code) { toast("请输入房间码", "err"); return; }
  try {
    await Api.gomokuJoin(code);
    enterRoom(code, "pvp");
  } catch (e) { toast(e.message, "err"); }
};
document.getElementById("btn-copy").onclick = async () => {
  const code = document.getElementById("room-code").textContent;
  try {
    await navigator.clipboard.writeText(code);
    toast("房间码已复制", "ok");
  } catch (e) {
    prompt("复制房间码", code);
  }
};
document.getElementById("btn-invite").onclick = () => {
  document.getElementById("invite-modal").style.display = "flex";
};
document.getElementById("inv-send").onclick = async () => {
  const to = document.getElementById("inv-to").value.trim();
  const code = document.getElementById("room-code").textContent;
  const extra = document.getElementById("inv-msg").value.trim();
  if (!to) { toast("请填写对方昵称", "err"); return; }
  try {
    await Api.mailSend(to, "五子棋邀请", `来一局五子棋！房间码：${code}${extra ? "\n" + extra : ""}`);
    document.getElementById("invite-modal").style.display = "none";
    toast("邀请已发送", "ok");
  } catch (e) { toast(e.message, "err"); }
};
document.getElementById("btn-leave").onclick = async () => {
  if (!state) return;
  try {
    await Api.gomokuLeave(state.code);
    location.reload();
  } catch (e) { toast(e.message, "err"); }
};

async function refreshRank() {
  try {
    const { list } = await Api.gomokuRank();
    const box = document.getElementById("rank-list");
    box.innerHTML = list.length
      ? list.map((r, i) => `<li class="rank-row ${i < 3 ? "top" : ""}"><span class="rank">${i + 1}</span><span class="rank-name">${escapeHtml(r.username)}</span><span class="rank-val">${r.wins} 胜</span></li>`).join("")
      : `<li class="rank-row empty">暂无对局记录</li>`;
  } catch (e) {}
}

animate();
refreshRank();
</script>
</body>
</html>
